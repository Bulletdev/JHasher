name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & Test (Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '23' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          validate-wrappers: true
          allow-snapshot-wrappers: true

      - name: Build
        run: ./gradlew classes --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Smoke test CLI
        run: |
          JAR=$(find build/libs -name '*-all.jar' | head -1)
          java -jar "$JAR" --version
          java -jar "$JAR" identify '5f4dcc3b5aa765d61d8327deb882cf99'
          java -jar "$JAR" generate sha256 'test'
          echo 'dGVzdA==' | java -jar "$JAR" chain 'base64decode'
          java -jar "$JAR" keygen --size 256

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-java-${{ matrix.java }}
          path: build/reports/tests/

      - name: Upload JAR
        if: matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jhasher-snapshot
          path: build/libs/*-all.jar

  build-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [ build ]
    if: always()
    steps:
      - name: Write Step Summary
        run: |
          status() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              *)       echo "skip" ;;
            esac
          }
          cat >> "$GITHUB_STEP_SUMMARY" << 'HEADER'
          ## CI Summary

          | Job | Status |
          |-----|--------|
          HEADER
          echo "| Build & Test | $(status "${{ needs.build.result }}") |" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const build = '${{ needs.build.result }}';
            const body = `## CI Summary

            | Job | Status |
            |-----|--------|
            | Build & Test | ${build === 'success' ? 'pass' : 'FAIL'} |

            ${build !== 'success' ? 'Build or tests failed - check the logs.' : 'All checks passed.'}
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
